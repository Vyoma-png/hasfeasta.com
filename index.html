<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Has-Feasta | AR Artisanal Creamery</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --festive-red: #8B0000;
            --gold: #D4AF37;
            --cream: #FFFBF5;
            --deep-plum: #2D0B22;
        }

        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--cream); color: var(--deep-plum); overflow-x: hidden; 
        }

        /* Hero Section */
        section { min-height: 100vh; padding: 100px 24px; display: flex; align-items: center; position: relative; z-index: 5; }
        .content { max-width: 500px; }
        h1 { font-family: 'Playfair Display'; font-size: 4rem; color: var(--festive-red); line-height: 1; }
        
        /* 3D Background Container */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 1; pointer-events: none; }

        /* Menu Overlay */
        #varieties-page { 
            position: fixed; inset: 0; background: var(--cream); z-index: 2000; 
            padding: 40px 20px; overflow-y: auto; display: none; 
        }
        #varieties-page.active { display: block; }

        /* AR Variety Card */
        .variety-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; }
        
        .variety-item { 
            background: white; padding: 20px; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; 
        }

        /* The 3D Model View in Menu */
        model-viewer {
            width: 100%; height: 300px; margin-bottom: 15px;
            --poster-color: transparent;
        }

        .action-bar { 
            display: flex; justify-content: center; align-items: center; 
            gap: 15px; margin-top: 15px; 
        }

        .price-tag { font-weight: 700; color: var(--festive-red); font-size: 1.2rem; }

        /* AR Button Style */
        .ar-button {
            background: var(--gold); color: white; border: none;
            padding: 8px 16px; border-radius: 50px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
        }

        .back-btn { position: fixed; top: 20px; right: 20px; padding: 10px 20px; border-radius: 50px; background: var(--festive-red); color: white; border: none; cursor: pointer; z-index: 2100; }

        .menu-trigger { background: var(--festive-red); color: white; padding: 15px 40px; border-radius: 50px; text-decoration: none; display: inline-block; margin-top: 20px; font-weight: 700; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <section>
        <div class="content">
            <span style="letter-spacing: 5px; color: var(--gold); font-weight: 700;">HAS-FEASTA</span>
            <h1>Feast in <br>Augmented <br>Reality.</h1>
            <p>Tap below to view our artisanal churns in your own space before you order.</p>
            <a href="#" class="menu-trigger" onclick="openMenu()">Open AR Menu</a>
        </div>
    </section>

    <div id="varieties-page">
        <button class="back-btn" onclick="closeMenu()">Close Menu</button>
        <h2 style="text-align: center; font-family: 'Playfair Display'; font-size: 2.5rem;">The AR Collection</h2>
        
        <div class="variety-grid" id="menu-items">
            </div>
    </div>

    <script>
        // Use real .glb files. 
        // Note: These are high-quality placeholder models from Google's library.
        // Replace 'src' and 'ios-src' with your actual hosted .glb and .usdz files.
        const menuItems = [
            {
                name: "Has-Feasta Special Sundae",
                price: "₹550",
                desc: "Triple cocoa layer with gold leaf.",
                model: "https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/IceCream/glTF-Binary/IceCream.glb",
                iosModel: "https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/IceCream/glTF-Binary/IceCream.glb" 
            },
            {
                name: "Belgian Noir Pint",
                price: "₹380",
                desc: "70% Dark Belgian cocoa solids.",
                model: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", // Placeholder: replace with Pint model
                iosModel: ""
            }
        ];

        function openMenu() {
            const container = document.getElementById('menu-items');
            container.innerHTML = menuItems.map(item => `
                <div class="variety-item">
                    <model-viewer 
                        src="${item.model}" 
                        ios-src="${item.iosModel}"
                        ar 
                        ar-modes="webxr scene-viewer quick-look" 
                        camera-controls 
                        shadow-intensity="1" 
                        auto-rotate>
                        <button slot="ar-button" style="display:none;"></button>
                    </model-viewer>
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <div class="action-bar">
                        <span class="price-tag">${item.price}</span>
                        <button class="ar-button" onclick="activateAR(this)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><polyline points="7 12 12 7 17 12"></polyline><line x1="12" y1="7" x2="12" y2="17"></line></svg>
                            View in Room
                        </button>
                    </div>
                </div>
            `).join('');
            document.getElementById('varieties-page').classList.add('active');
        }

        function closeMenu() {
            document.getElementById('varieties-page').classList.remove('active');
        }

        function activateAR(btn) {
            // Trigger the internal model-viewer AR button
            const mv = btn.closest('.variety-item').querySelector('model-viewer');
            mv.activateAR();
        }

        // Background 3D Pint (Similar to previous version)
        // [Standard Three.js init code would go here to maintain the rotating pint background]
    </script>
</body>
</html>
